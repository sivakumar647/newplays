apiVersion: v1
kind: Service
metadata:
  labels:
    app: web1
  name: my-cluster-ip
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: web1
  type: clusterIP
---
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: web1
  name: my-cluster-ip
spec:
  containers:
  - image: nginx
    name: my-cluster-ip
    ports:
    - containerPort: 80
