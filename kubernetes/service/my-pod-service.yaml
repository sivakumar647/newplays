apiVersion: v1
kind: Service
metadata:
  labels:
    app: my-services
  name: httpd
spec:
  type: NodePort
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    nodePort: 30071
  selector:
    app: my-service
---
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: my-services1
  name: httpd1
spec:
  type: NodePort
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
    nodePort: 30072
  selector:
    app: my-service
---
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: my-service
  name: httpd-pod
spec:
  containers:
  - image: httpd
    name: my-pod
    ports:
    - containerPort: 80
